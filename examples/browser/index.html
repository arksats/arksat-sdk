<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arksat SDK integration example</title>
<style>
  body { font: 16px/1.6 system-ui,sans-serif; max-width: 760px; margin: 48px auto; padding: 0 24px; color: #17212c; background: #f7f9fb; }
  button,input { font: inherit; padding: 9px 12px; margin: 5px 0; }
  input:not([type=checkbox]) { display: block; width: min(100%,580px); box-sizing: border-box; }
  button { cursor: pointer; } button:disabled { cursor: default; }
  section { margin: 24px 0; padding: 20px; background: white; border: 1px solid #dfe5ec; border-radius: 12px; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.7 monospace; }
</style>
<h1>Arksat SDK integration example</h1>
<p>Connect, detect capabilities, send BTC, track status and handle account changes. Uses an in-memory mock wallet by default; no real funds move.</p>
<section>
  <label><input id="mock" type="checkbox" checked> Use mock wallet</label><br>
  <button id="connect">Connect wallet</button> <button id="disconnect" disabled>Disconnect</button>
  <p id="wallet">Not connected</p>
</section>
<section>
  <label for="address">Recipient address</label><input id="address" value="mock:recipient">
  <label for="amount">Amount (integer sats)</label><input id="amount" type="number" min="1" step="1" value="1000">
  <button id="send" disabled>Send BTC</button>
  <button id="query" disabled>Query transaction</button>
  <button id="confirm" disabled>Simulate confirmation</button>
  <p id="status" role="status" aria-live="polite">Connect a wallet first.</p>
</section>
<section><h2>Event log</h2><pre id="log"></pre></section>
<script type="module" src="/examples/browser/main.js"></script>
</html>
